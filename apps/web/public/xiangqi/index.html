<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国象棋 · 单机版</title>
<link rel="stylesheet" href="css/style.css?v=light-1">
</head>
<body>
<noscript><p style="color:#fff;background:#8b2727;padding:12px">需要启用 JavaScript 才能显示棋盘。</p></noscript>
<p id="bootError" role="alert" hidden style="color:#fff;background:#8b2727;padding:12px;max-width:600px">棋盘没有加载成功。请先完整解压，再打开 index.html，或直接打开随附的单文件版。</p>
<div id="app">
  <header>
    <h1>中国象棋</h1>
    <div class="controls">
      <button id="btnNew">重新开局</button>
      <button id="btnUndo">悔棋</button>
      <button id="btnFlip" title="翻转视角">翻转棋盘</button>
      <label class="hint-mode"><input type="checkbox" id="chkHints" checked> 走法提示</label>
    </div>
  </header>
  <div class="table">
    <div class="side black">
      <div class="captured" id="capturedBlack"></div>
      <div class="clock" id="statusBlack">黑方思考中…</div>
    </div>
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 460 510" preserveAspectRatio="xMidYMid meet">
        <g id="gridLayer"></g>
        <g id="starLayer"></g>
        <g id="hintLayer"></g>
        <g id="selLayer"></g>
        <g id="pieceLayer"></g>
      </svg>
    </div>
    <div class="side red">
      <div class="clock" id="statusRed">红方先行</div>
      <div class="captured" id="capturedRed"></div>
    </div>
  </div>
  <div class="right-col">
    <div class="movelist-box">
      <div class="movelist-title">着法记录</div>
      <ol id="moveList"></ol>
    </div>
    <div class="status-bar" id="statusBar">红方行棋</div>
  </div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">对局结束</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions"><button id="modalReview">查看棋局</button> <button id="modalOk">再来一局</button></div>
  </div>
</div>
<script src="js/engine.js"></script>
<script src="js/notation.js"></script>
<script src="js/geom.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (document.getElementById('board').getAttribute('data-ready') !== 'true') {
    document.getElementById('bootError').hidden = false;
  }
});
</script>
<footer style="position:fixed;bottom:2px;right:8px;font-size:10px;opacity:.55">棋子：Kadagaden / chess-pieces · CC BY 4.0 · 已调整显示尺寸</footer>
</body>
</html>
